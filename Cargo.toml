[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system, with community extensions"
edition = "2024"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.96"
version = "3.0.1"
exclude = ["dist"]

[[bin]]
name = "stub_gen"
required-features = ["python_stubgen"]

[lib]
name = "symbolica_community"
crate-type = ["rlib", "cdylib"]

# Reuse optimized Symbolica while keeping the Feynkit crates quick to rebuild.
[profile.dev.package.symbolica]
opt-level = 2

# Optimize browser downloads separately from native release performance.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Speed-oriented Pyodide build; preserve unwinding for Python panic handling.
[profile.release-performance]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[features]
default = ["module", "native"]
module = ["pyo3/abi3-py39"] # incompatible with stub_gen
# Keep the system allocator: mimalloc can crash after Python's importing thread exits.
native = ["hyperbolica/native", "symbolica/tracing_max_level_info", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation", "spynso3/native", "feynkit-py/native"]
wasm = ["hyperbolica/wasm", "symbolica/wasm", "spynso3/wasm", "feynkit-py/wasm", "one-loop-reduce-python/wasm"]
python_stubgen = [
    "hyperbolica/python_stubgen",
    "native",
    "pyo3-stub-gen",
    "symbolica/python_stubgen",
    "spynso3/python_stubgen",
    "feynkit-py/python_stubgen",
    "vakint/python_stubgen",
    "one-loop-reduce-python/python_stubgen",
]

[dependencies]
hyperbolica = { git = "https://github.com/benruijl/hyperbolica", rev = "6acf21500c4807ac1fbd67e1429efcad90791de1", default-features = false, features = ["python"] }
one-loop-reduce-python = { git = "https://github.com/lcnbr/one-loop-reduce", branch = "main", default-features = false }
spynso3 = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
# Aggregates the cff, generator, graph, tensor, model, and kinematics bindings.
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["ufo"] }
symbolica = { version = "3.0.1", default-features = false, features = ["python_export"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
# Tensor bindings split methods across impl blocks on both native and WASM.
pyo3 = { version = "0.28", features = ["multiple-pymethods"] }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = [
    "numpy",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Compile the IBP bridge into the host extension to share native Symbolica atoms.
rustred-feynkit = { git = "https://github.com/alphal00p/rustred", branch = "main" }
# Share the host kernel; OneLOop currently requires native numeric/JIT support.
oneloop-python = { git = "https://github.com/alphal00p/oneloopmaster", branch = "main", default-features = false, features = ["community"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster", branch = "main" }
# Vakint currently requires native dependencies, including GMP/MPFR.
vakint = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", features = ["symbolica_community_module"] }

# All community modules share the Symbolica kernel from its community branch.
[patch.crates-io]
# Shared lazy FormattedOutput; see examples/reproducers/symbolic-display in Feynkit.
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "community" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
