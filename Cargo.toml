[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system, with community extensions"
edition = "2024"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.96"
version = "3.0.2"
exclude = ["dist", "reports/**"]

[package.metadata.symbolica-data]
manifest = "python/symbolica/data_compatibility.json"

# Keep this host independent when checked out inside another Rust workspace.
[workspace]
resolver = "3"

[[bin]]
name = "stub_gen"
required-features = ["python_stubgen"]

[lib]
name = "symbolica_community"
crate-type = ["rlib", "cdylib"]

# Reuse optimized Symbolica while keeping the Feynkit crates quick to rebuild.
[profile.dev.package.symbolica]
opt-level = 2

# Optimize across crates in native release builds with ThinLTO.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = "symbols"

# Optimize browser downloads separately from native release performance.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Speed-oriented Pyodide build; preserve unwinding for Python panic handling.
[profile.release-performance]
inherits = "release"
opt-level = 3
# Fat LTO exceeds the CI runner memory limit for the community WASM build.
lto = "thin"
codegen-units = 1
strip = "symbols"

[features]
# Shared solver storage is enabled by community builds without changing arities.
ibp-capacity-dispatch = ["rustred-feynkit?/capacity-dispatch", "symbolica-amflow?/capacity-dispatch"]
# Required before RUSTRED_RUNTIME_ARITIES may restrict/extend the registry.
ibp-runtime-arity-selection = ["rustred-feynkit?/runtime-arity-selection", "symbolica-amflow?/runtime-arity-selection"]
default = ["module", "native", "community"]
module = ["pyo3/abi3-py39"] # incompatible with stub_gen
community = [
    "ibp-capacity-dispatch",
    "dep:spynso3", "dep:linnet-py", "dep:feynkit-py", "dep:one-loop-reduce-python",
    "dep:rustred-feynkit", "dep:oneloop-python", "dep:oneloop", "dep:vakint",
    "dep:hyperbolica", "dep:symbolica-amflow", "dep:fastsecdec-python",
]
# Keep the system allocator: mimalloc can crash after Python's importing thread exits.
native = ["hyperbolica?/native", "symbolica/tracing_max_level_info", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation", "spynso3?/native", "linnet-py?/native", "feynkit-py?/native", "rustred-feynkit?/native", "symbolica-amflow?/python", "fastsecdec-python?/native"]
# Use --no-default-features --features wasm-core for the kernel + integration only.
wasm-core = ["symbolica/wasm"]
wasm = ["wasm-core", "community", "hyperbolica/wasm", "spynso3/wasm", "linnet-py/wasm", "feynkit-py/wasm", "rustred-feynkit/wasm", "one-loop-reduce-python/wasm", "symbolica-amflow/python_wasm", "fastsecdec-python?/portable"]
python_stubgen = [
    "hyperbolica/python_stubgen",
    "native",
    "community",
    "pyo3-stub-gen",
    "symbolica/python_stubgen",
    "spynso3/python_stubgen",
    "linnet-py/python_stubgen",
    "feynkit-py/python_stubgen",
    "vakint/python_stubgen",
    "one-loop-reduce-python/python_stubgen",
    "symbolica-amflow/python_stubgen",
    "fastsecdec-python?/python_stubgen",
]

[dependencies]
symbolica-data = { git = "https://github.com/alphal00p/gammaloop", rev = "1f4f2492d818c5bebdbf34af4e4dd3b504756aef" }
serde_json = "1"
fastsecdec-python = { optional = true, git = "https://github.com/alphal00p/fastSecDec", rev = "da3b97a4dea0453a8984538d567a4336c4c512e3", default-features = false }
hyperbolica = { optional = true, git = "https://github.com/lcnbr/hyperbolica", rev = "2e6fe4ef9c715d70f937aca53211793727f819b9", default-features = false, features = ["python"] }
one-loop-reduce-python = { optional = true, git = "https://github.com/lcnbr/one-loop-reduce", rev = "15fd03bc11a0985022ed881e549fe52ea2565708", default-features = false }
spynso3 = { optional = true, git = "https://github.com/alphal00p/gammaloop", rev = "1f4f2492d818c5bebdbf34af4e4dd3b504756aef", default-features = false }
linnet-py = { optional = true, git = "https://github.com/alphal00p/gammaloop", rev = "1f4f2492d818c5bebdbf34af4e4dd3b504756aef", default-features = false }
# Aggregates the cff, generator, graph, tensor, model, and kinematics bindings.
feynkit-py = { optional = true, git = "https://github.com/alphal00p/gammaloop", rev = "1f4f2492d818c5bebdbf34af4e4dd3b504756aef", default-features = false, features = ["ufo", "linnet-python"] }
# Embed the IBP bridge in both hosts so it shares their Symbolica atoms.
rustred-feynkit = { optional = true, git = "https://github.com/alphal00p/rustred", rev = "c2ca815cc906bdeaf7cb8c63b637e81a80fba917", default-features = false, features = ["campaign-api"] }
symbolica = { version = "3.0.1", default-features = false, features = ["python_export"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
symbolica-amflow = { optional = true, git = "https://github.com/alphal00p/RustFlow", rev = "a2c6124ec5305e52b780a4c5bf3c1adf3a3ecb67", default-features = false, features = ["python_api"] }
# Tensor bindings split methods across impl blocks on both native and WASM.
pyo3 = { version = "=0.28.3", features = ["multiple-pymethods"] }
pyo3-log = "=0.13.4"
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = [
    "numpy",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Share the host kernel; OneLOop currently requires native numeric/JIT support.
oneloop-python = { optional = true, git = "https://github.com/alphal00p/oneloopmaster", branch = "main", default-features = false, features = ["community"] }
# Keep embedded SymJIT caches and generated native evaluators out of wheels.
oneloop = { optional = true, git = "https://github.com/alphal00p/oneloopmaster", branch = "main", default-features = false }
# RustRed-enabled Vakint shares the host's immutable native owner snapshot.
vakint = { optional = true, git = "https://github.com/alphal00p/gammaloop", rev = "1f4f2492d818c5bebdbf34af4e4dd3b504756aef", features = ["feynkit-ingress", "experimental-rustred", "weighted-lowering-diagnostics", "symbolica_community_module", "progress-tui"] }

# All community modules share one Symbolica kernel and numeric owners.
[patch.crates-io]
# Match Main's portable Clarabel adapter for direct and transitive consumers.
clarabel = { git = "https://github.com/oxfordcontrol/Clarabel.rs", rev = "14ad0f09073224e11ce13633d655547001072059" }
# Lean notebook Typst compiler; retain the immutable vendor provider snapshot.
typst-library = { git = "https://github.com/alphal00p/gammaloop", rev = "9ce69d95ac52586426a23ef7cb6b791c09e4e4f0" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", rev = "9ce69d95ac52586426a23ef7cb6b791c09e4e4f0" }
# Native evaluator composition for numerical-dual sector generation (Symbolica PR #54).
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
# Preserve the official negative-integer serialization fix and shared numeric types.
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
