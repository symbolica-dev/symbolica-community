[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system, with community extensions"
edition = "2024"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.89"
version = "3.0.0"
exclude = ["dist"]

[[bin]]
name = "stub_gen"
required-features = ["python_stubgen"]

[lib]
name = "symbolica_community"
crate-type = ["rlib", "cdylib"]

# Optimize browser downloads separately from native release performance.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[features]
default = ["module", "native"]
module = ["pyo3/abi3", "symbolica/python_abi3"] # incompatible with stub_gen
native = ["symbolica/default", "idenso/native", "spynso3/native", "example_extension/native"]
wasm = ["symbolica/wasm", "idenso/wasm", "spynso3/wasm", "example_extension/wasm"]
python_stubgen = [
    "native",
    "pyo3-stub-gen",
    "symbolica/python_stubgen",
    "spynso3/python_stubgen",
    "idenso/python_stubgen",
    "vakint/python_stubgen",
    "example_extension/python_stubgen",
]

[dependencies]
example_extension = { path = "example_extension", default-features = false }
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "main", default-features = false, features = ["bincode", "python"] }
spynso3 = { git = "https://github.com/alphal00p/gammaloop", branch = "main", default-features = false }
symbolica = { version = "3.0", default-features = false, features = ["python_export"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
pyo3 = { version = "0.28" }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = [
    "numpy",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Vakint currently requires native dependencies, including GMP/MPFR.
vakint = { git = "https://github.com/alphal00p/gammaloop", branch = "main", features = ["symbolica_community_module"] }
mimalloc = { version = "0.1", features = [
    "local_dynamic_tls",
] } # prevent TLS allocation errors in conjunction with numpy

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }
