[package]
name = "example_extension"
version = "0.1.0"
edition = "2024"


[lib]
name = "example_extension"
crate-type = ["rlib", "cdylib"]

[dependencies]
symbolica = { version = "3.0", default-features = false, features = ["python_export"] }
pyo3 = "0.28"
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false }

[features]
default = ["native"]
native = ["symbolica/default"]
wasm = ["symbolica/wasm"]
python_stubgen = ["pyo3-stub-gen", "symbolica/python_stubgen"]
