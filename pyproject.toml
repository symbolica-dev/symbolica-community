[build-system]
requires = ["maturin>=1.13.2,<2.0"]
build-backend = "maturin"

[project]
authors = [
    { name = "Ben Ruijl", email = "benruyl@gmail.com" },
    { name = "Lucien Huber", email = "mail@lucien.ch" },
    { name = "Valentin Hirschi", email = "valentin.hirschi@gmail.com" },
]
name = "symbolica"
description = "Symbolica: a blazing fast computer algebra system, with community extensions"
keywords = ["math", "algebra", "polynomial", "expression", "manipulation"]
version = "3.0.0"
readme = "Readme_pypi.md"
requires-python = ">=3.9"
dependencies = ["anywidget>=0.9,<1; sys_platform == 'emscripten'"]
license-files = ["LICENSE", "licenses/*"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
numpy = ["numpy"]
notebook-display = [
    "anywidget>=0.9,<1; python_version >= '3.9'",
    # Native tensor paging runs Typst in a worker with a hard rendering timeout.
    # Browser paging uses the embedded compiler instead.
    "typst>=0.15,<0.16; sys_platform != 'emscripten' and sys_platform != 'wasi'",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "symbolica.core"
python-source = "python"
include = [
    "examples/hep/hep_two_loop_kite.py",
    "examples/hep/massive_kite.py",
]

[project.urls]
homepage = "https://symbolica.io"
repository = "https://github.com/symbolica-dev/symbolica"

[tool.poetry]
package-mode = false

[tool.uv]
package = false

cache-keys = [{ file = "pyproject.toml" }, { file = "src/*.rs" }]


[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ty>=0.0.75; python_version >= '3.8'",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.marimo.language_servers.ty]
enabled = true

[tool.marimo.diagnostics]
enabled = true

[tool.marimo.runtime]
# Keep marimo's standard guard against oversized notebook outputs.
output_max_bytes = 8_000_000
