name: Experimental FastSecDec bridge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential m4 pkg-config
          python -m pip install maturin==1.15.0 pytest marimo==0.24.2
      - name: Prepare pinned owner patches
        run: bash scripts/prepare_fastsecdec_dependencies.sh "$RUNNER_TEMP/fastsecdec-dependencies"
      - name: Check published dependency identities
        run: |
          cargo metadata --locked --features experimental-fastsecdec \
            --config "$RUNNER_TEMP/fastsecdec-dependencies/overlay-community-git.toml" \
            --format-version 1 > "$RUNNER_TEMP/fastsecdec-metadata.json"
          python "$RUNNER_TEMP/fastsecdec-dependencies/fastsecdec/bindings/python/scripts/check_dependencies.py" "$RUNNER_TEMP/fastsecdec-metadata.json" native
      - name: Build and install experimental wheel
        run: |
          CARGO_HOME="$RUNNER_TEMP/fastsecdec-dependencies/cargo-home" \
            maturin build --locked --features experimental-fastsecdec --out dist-fastsecdec
          python -m pip install dist-fastsecdec/*.whl
      - name: Run maintained FastSecDec controls and the host smoke test
        env:
          SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
        run: |
          python -c 'from symbolica.community.hepkit.sector_decomposition import sector_decompose, Integral; from symbolica.community.hepkit.fastsecdec import Integral as LegacyIntegral; assert Integral is LegacyIntegral'
          bash "$RUNNER_TEMP/fastsecdec-dependencies/fastsecdec/bindings/python/scripts/test-native.sh" "$GITHUB_WORKSPACE"
