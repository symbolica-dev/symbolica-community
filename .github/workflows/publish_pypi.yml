name: PyPi wheel generation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build external data bundle
        run: python scripts/build_data_bundle.py --out dist --check-catalog
      - name: Check distribution size
        run: python scripts/check_distribution_size.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-data
          path: |
            dist/symbolica_fonts-*.whl
  linux:
    runs-on: ${{ matrix.runner[0] }}
    strategy:
      fail-fast: false
      matrix:
        runner: [[ubuntu-24.04, x86_64]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify manylinux build image
        id: manylinux
        run: |
          docker pull quay.io/pypa/manylinux2014_x86_64:latest
          image=$(docker image inspect quay.io/pypa/manylinux2014_x86_64:latest --format '{{index .RepoDigests 0}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image-id=${image##*@sha256:}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/cache-native-dependencies
        with:
          variant: release-manylinux2014-${{ steps.manylinux.outputs.image-id }}-py310
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        with:
          target: ${{ matrix.runner[1] }}
          args: --release --compression-level 9 --out dist --sdist
          sccache: "true"
          manylinux: auto
          container: ${{ steps.manylinux.outputs.image }}
          # GMP_MPFR_SYS_CACHE is not automatically forwarded by maturin-action.
          docker-options: --env GMP_MPFR_SYS_CACHE=${{ github.workspace }}/.ci-cache/gmp-mpfr
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.runner[1] }}
          path: dist
  macos:
    runs-on: ${{ matrix.runner[0] }}
    strategy:
      fail-fast: false
      matrix:
        runner: [[macos-15-intel, x86_64], [macos-14, aarch64]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install LLVM Mach-O linker
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cache-native-dependencies
        with:
          variant: release-macos-${{ matrix.runner[1] }}-py310
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        with:
          target: ${{ matrix.runner[1] }}
          args: --release --compression-level 9 --out dist
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.runner[1] }}
          path: dist
  windows:
    runs-on: windows-latest
    env:
      # Keep GMP and MPFR on the same printf implementation validated by the UCRT64 probe.
      CFLAGS: "-O2 -D__USE_MINGW_ANSI_STDIO=1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            ca-certificates
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-make
            m4

      - uses: ./.github/actions/cache-native-dependencies
        with:
          variant: release-windows-ucrt64-py311
          shell: msys2 {0}
          command-format: msys2 -c "{0}"

      - name: Build and Repair wheels
        shell: msys2 {0}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        run: |
          pip install maturin delvewheel
          maturin build --release --compression-level 9 --out dist
          delvewheel repair dist/*.whl --wheel-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: wheelhouse

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [data, linux, macos, windows]
    if: inputs.publish == true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Check core citation stub in source and wheels
        run: python .github/scripts/check_core_stub.py python/symbolica/core.pyi dist/symbolica-*.whl

      - name: Check distribution sizes
        run: python scripts/check_distribution_size.py dist/*

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*
