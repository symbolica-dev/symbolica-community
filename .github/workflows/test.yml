name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest]
                python-version: ["3.10"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Check core citations and reflected arithmetic stubs in source
              run: python .github/scripts/check_core_stub.py python/symbolica/core.pyi

            - name: Install LLVM Mach-O linker
              if: runner.os == 'macOS'
              run: |
                  brew install llvm lld
                  echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
                  echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

            - uses: dtolnay/rust-toolchain@stable

            - uses: ./.github/actions/cache-native-dependencies
              with:
                  variant: test-dev-py${{ matrix.python-version }}

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              env:
                  # Match tool.maturin.features when fingerprinting the host graph.
                  RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
                  RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
              with:
                  command: build
                  args: --out dist
                  sccache: "true"

            - name: Check integration wheel and shared kernel
              run: |
                  python -m pip install "tomli>=2.0.1; python_version < '3.11'"
                  python .github/scripts/check_integration_package.py dist/*.whl

            - name: Check core citations and reflected arithmetic stubs in source and wheel
              run: python .github/scripts/check_core_stub.py python/symbolica/core.pyi dist/*.whl

            - name: Build resource wheels
              run: python scripts/build_data_bundle.py --out dist --check-catalog

            - name: Install package and test dependencies
              run: |
                  pip install dist/symbolica_fonts-*.whl dist/symbolica_vakint_data-*.whl
                  for wheel in dist/symbolica-*.whl; do
                      pip install "$wheel[notebook-display]"
                  done
                  pip install pytest pytest-cov ty numpy matplotlib scipy "marimo>=0.25.1,<0.26" "docstring-to-markdown>=0.17,<1" "tomli>=2.0.1; python_version < '3.11'"

            - name: Check public community import types
              run: ty check --python-version 3.10 tests/typing/community_layout.py tests/typing/core_arithmetic.py tests/typing/expression_products.py tests/typing/integration.py tests/typing/loop_integration.py tests/typing/scoped_reductions.py tests/typing/tensor_evaluation.py

            - name: Run tests once (with coverage on Linux)
              env:
                  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
              run: |
                  if [[ "${{ runner.os }}" == "Linux" ]]; then
                      pytest tests/ -v --cov=symbolica --cov-report=xml --cov-report=term --durations=20
                  else
                      pytest tests/ -v --durations=20
                  fi

            - name: Upload coverage to codecov
              if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.10'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage.xml
                  fail_ci_if_error: false
