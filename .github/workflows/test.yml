name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ["3.10"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              env:
                  # Match tool.maturin.features when fingerprinting the host graph.
                  RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
                  RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
              with:
                  command: build
                  args: --out dist
                  sccache: "true"

            - name: Check integration wheel and shared kernel
              run: python .github/scripts/check_integration_package.py dist/*.whl

            - name: Check core citation stub in source and wheel
              run: python .github/scripts/check_core_stub.py python/symbolica/core.pyi dist/*.whl

            - name: Install package and test dependencies
              run: |
                  for wheel in dist/*.whl; do
                      pip install "$wheel[notebook-display]"
                  done
                  pip install pytest ty numpy

            - name: Check public community import types
              run: ty check --python-version 3.10 tests/typing/community_layout.py tests/typing/expression_products.py tests/typing/integration.py tests/typing/loop_integration.py tests/typing/scoped_reductions.py

            - name: Run tests
              env:
                  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
              run: pytest tests/ -v

            - name: Run tests with coverage
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
              env:
                  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
              run: |
                  pip install pytest-cov
                  pytest tests/ --cov=symbolica --cov-report=xml --cov-report=term

            - name: Upload coverage to codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
              uses: codecov/codecov-action@v3
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage.xml
                  fail_ci_if_error: false

            # Install Marimo after the broad suite so only this focused smoke
            # check enables notebook execution; no two-loop boundaries run here.
            - name: Render the Higgs-jet notebook and check its controller
              env:
                  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
              run: |
                  pip install 'marimo>=0.24.2,<0.25'
                  python -m pytest -q tests/test_hep_gg_hg.py tests/test_hep_notebooks.py -k gg_hg
